    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: #000000;
            position: relative;
            cursor: none;
        }

        /* Tähdet */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite alternate;
        }

        .star:nth-child(odd) {
            animation-delay: 1.5s;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* Lumihiutaleet */
        .snowflake {
            position: absolute;
            top: -10px;
            color: white;
            font-size: 1rem;
            animation: snowfall linear infinite;
            z-index: 5;
            pointer-events: none;
        }

        @keyframes snowfall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0.3;
            }
        }

        /* Kuusia */
        .tree {
            position: absolute;
            bottom: 0;
            z-index: 3;
        }

        .tree-triangle {
            width: 0;
            height: 0;
            border-style: solid;
            margin: 0 auto;
        }

        .tree-trunk {
            width: 20px;
            height: 30px;
            background: #4a2c2a;
            margin: 0 auto;
        }

        /* Jouluteksti */
        .christmas-text {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-family: 'Times New Roman', serif;
            font-size: 3rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 6;
            animation: text-glow 4s ease-in-out infinite alternate;
        }

        @keyframes text-glow {
            0% { text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
            100% { text-shadow: 2px 2px 20px rgba(255,255,255,0.8), 2px 2px 4px rgba(0,0,0,0.5); }
        }

        /* Pikkujoulunimigeneraattori */
        .name-generator {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 25, 45, 0.95);
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            z-index: 6;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(100, 150, 255, 0.3);
        }

        .name-generator h3 {
            color: #fff;
            margin-bottom: 15px;
            font-family: 'Times New Roman', serif;
            font-size: 1.3rem;
        }

        .name-generator p {
            color: #ccc;
            margin-bottom: 15px;
            font-style: italic;
        }

        .name-input {
            padding: 10px 15px;
            font-size: 1rem;
            border: 2px solid #4caf50;
            border-radius: 8px;
            margin-right: 10px;
            outline: none;
            font-family: Arial, sans-serif;
        }

        .name-input:focus {
            border-color: #d32f2f;
            box-shadow: 0 0 10px rgba(211, 47, 47, 0.3);
        }

        .generate-btn {
            padding: 10px 20px;
            background: linear-gradient(45deg, #d32f2f, #f44336);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(211, 47, 47, 0.4);
        }

        .result {
            margin-top: 15px;
            padding: 10px;
            background: rgba(76, 175, 80, 0.1);
            border-radius: 8px;
            color: #4caf50;
            font-weight: bold;
            font-size: 1.1rem;
            min-height: 20px;
        }

        /* Jakopainikkeet */
        .share-buttons {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 6;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .share-buttons.show {
            opacity: 1;
        }

        .share-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .share-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .facebook-btn {
            background: #1877f2;
            color: white;
        }

        .twitter-btn {
            background: #1da1f2;
            color: white;
        }

        .whatsapp-btn {
            background: #25d366;
            color: white;
        }

        .copy-btn {
            background: #6c757d;
            color: white;
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    
    <div class="christmas-text">Hyvää Joulua! 🎄</div>
    
    <!-- Pikkujoulunimigeneraattori -->
    <div class="name-generator">
        <h3>🎅 Testaa pikkujoulunimesi! 🎅</h3>
        <p>Hupaisa testi juhlien ratoksi!</p>
        <div>
            <input type="text" class="name-input" placeholder="Kirjoita nimesi tähän..." maxlength="20">
            <button class="generate-btn" onclick="generateChristmasName()">Testaa!</button>
        </div>
        <div class="result" id="nameResult"></div>
    </div>

    <!-- Jakopainikkeet -->
    <div class="share-buttons" id="shareButtons">
        <a href="#" class="share-btn facebook-btn" onclick="shareOnFacebook()">
            📘 Jaa Facebookissa
        </a>
        <a href="#" class="share-btn twitter-btn" onclick="shareOnTwitter()">
            🐦 Jaa Twitterissä
        </a>
        <a href="#" class="share-btn whatsapp-btn" onclick="shareOnWhatsApp()">
            📱 Jaa WhatsAppissa
        </a>
        <button class="share-btn copy-btn" onclick="copyToClipboard()">
            📋 Kopioi linkki
        </button>
    </div>

    <!-- Kuusia -->
    <div class="tree" style="left: 5%; transform: scale(1.2);">
        <div class="tree-triangle" style="border-left: 30px solid transparent; border-right: 30px solid transparent; border-bottom: 40px solid #1b5e20;"></div>
        <div class="tree-triangle" style="border-left: 25px solid transparent; border-right: 25px solid transparent; border-bottom: 35px solid #2e7d32; margin-top: -15px;"></div>
        <div class="tree-triangle" style="border-left: 20px solid transparent; border-right: 20px solid transparent; border-bottom: 30px solid #4caf50; margin-top: -10px;"></div>
        <div class="tree-trunk"></div>
    </div>

    <div class="tree" style="right: 8%; transform: scale(0.9);">
        <div class="tree-triangle" style="border-left: 25px solid transparent; border-right: 25px solid transparent; border-bottom: 35px solid #1b5e20;"></div>
        <div class="tree-triangle" style="border-left: 20px solid transparent; border-right: 20px solid transparent; border-bottom: 30px solid #2e7d32; margin-top: -12px;"></div>
        <div class="tree-triangle" style="border-left: 15px solid transparent; border-right: 15px solid transparent; border-bottom: 25px solid #4caf50; margin-top: -8px;"></div>
        <div class="tree-trunk" style="width: 15px; height: 25px;"></div>
    </div>

    <div class="tree" style="left: 80%; transform: scale(0.7);">
        <div class="tree-triangle" style="border-left: 20px solid transparent; border-right: 20px solid transparent; border-bottom: 30px solid #1b5e20;"></div>
        <div class="tree-triangle" style="border-left: 15px solid transparent; border-right: 15px solid transparent; border-bottom: 25px solid #2e7d32; margin-top: -10px;"></div>
        <div class="tree-trunk" style="width: 12px; height: 20px;"></div>
    </div>

    <script>
        // Luo tähtiä
        function createStars() {
            const starsContainer = document.querySelector('.stars');
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 60 + '%';
                star.style.width = (Math.random() * 3 + 1) + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (Math.random() * 3 + 2) + 's';
                starsContainer.appendChild(star);
            }
        }

        // Luo lumihiutaleita
        function createSnowflakes() {
            const snowflakes = ['❄', '❅', '❆', '✻', '✼', '❋'];
            
            function addSnowflake() {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                snowflake.innerHTML = snowflakes[Math.floor(Math.random() * snowflakes.length)];
                snowflake.style.left = Math.random() * 100 + '%';
                snowflake.style.fontSize = (Math.random() * 1.5 + 0.5) + 'rem';
                snowflake.style.animationDuration = (Math.random() * 8 + 5) + 's';
                snowflake.style.animationDelay = Math.random() * 2 + 's';
                snowflake.style.opacity = Math.random() * 0.7 + 0.3;
                
                document.body.appendChild(snowflake);
                
                // Poista lumihiutale animaation jälkeen
                setTimeout(() => {
                    snowflake.remove();
                }, parseFloat(snowflake.style.animationDuration) * 1000 + 2000);
            }
            
            // Luo lumihiutaleita säännöllisesti
            setInterval(addSnowflake, 300);
            
            // Luo alkuperäiset lumihiutaleet
            for (let i = 0; i < 15; i++) {
                setTimeout(addSnowflake, i * 200);
            }
        }

        // Pikkujoulunimigeneraattori
        function generateChristmasName() {
            const input = document.querySelector('.name-input');
            const result = document.getElementById('nameResult');
            const shareButtons = document.getElementById('shareButtons');
            
            const name = input.value.trim();
            
            if (name === '') {
                result.textContent = 'Syötä ensin nimesi! 🎄';
                shareButtons.classList.remove('show');
                return;
            }
            
            const christmasName = `Pikkujoulu-${name}`;
            result.innerHTML = `🎅 Sinun pikkujoulunimesi on: <strong>${christmasName}</strong> 🎅`;
            
            // Näytä jakopainikkeet
            shareButtons.classList.add('show');
        }

        // Enter-näppäin toimii
        document.querySelector('.name-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                generateChristmasName();
            }
        });

        // Jakofunktiot
        function shareOnFacebook() {
            const name = document.querySelector('.name-input').value.trim();
            if (!name) return;
            
            const text = `Minun pikkujoulunimeni on Pikkujoulu-${name}! 🎅 Testaa sinäkin omasi: `;
            const url = window.location.href;
            const shareUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}&quote=${encodeURIComponent(text)}`;
            window.open(shareUrl, '_blank', 'width=600,height=400');
        }

        function shareOnTwitter() {
            const name = document.querySelector('.name-input').value.trim();
            if (!name) return;
            
            const text = `Minun pikkujoulunimeni on Pikkujoulu-${name}! 🎅🎄 Testaa sinäkin omasi: `;
            const url = window.location.href;
            const shareUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`;
            window.open(shareUrl, '_blank', 'width=600,height=400');
        }

        function shareOnWhatsApp() {
            const name = document.querySelector('.name-input').value.trim();
            if (!name) return;
            
            const text = `Minun pikkujoulunimeni on Pikkujoulu-${name}! 🎅 Testaa sinäkin omasi: ${window.location.href}`;
            const shareUrl = `https://wa.me/?text=${encodeURIComponent(text)}`;
            window.open(shareUrl, '_blank');
        }

        function copyToClipboard() {
            const name = document.querySelector('.name-input').value.trim();
            if (!name) return;
            
            const text = `Minun pikkujoulunimeni on Pikkujoulu-${name}! 🎅 Testaa sinäkin omasi: ${window.location.href}`;
            
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    const btn = event.target;
                    const originalText = btn.textContent;
                    btn.textContent = '✅ Kopioitu!';
                    setTimeout(() => {
                        btn.textContent = originalText;
                    }, 2000);
                });
            } else {
                // Fallback vanhemmille selaimille
                const textArea = document.createElement('textarea');
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✅ Kopioitu!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            }
        }

        // Alusta animaatiot
        createStars();
        createSnowflakes();

        // Fullscreen-tuki
        document.addEventListener('keydown', (e) => {
            if (e.key === 'F11') {
                e.preventDefault();
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            }
        });
    </script>
</body>
</html>
