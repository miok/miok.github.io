    ...drawn.map((c,i)=>`<div class="χχ"><div class="ψψ">${_POS[i].p}: ${c.n}${c.reversed?' \u21A9':''}</div><div class="ωω">${_interp(c,i,th)}</div></div>`),
    `<div class="ΑΑ">${_summ(drawn,topic)}</div>`,
  ].join('');
  out.classList.add('υ');
  _id('_tb').disabled=false;
}

_id('_ti').addEventListener('keydown',e=>{if(e.key==='\x45\x6e\x74\x65\x72')_draw();});
